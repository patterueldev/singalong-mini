services:
  db:
    image: postgres:16-alpine
    container_name: singalong-dev-db
    environment:
      POSTGRES_DB: singalong
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./data/singalong-db:/var/lib/postgresql/data
    # Same guard rails as production (issue #60) so a dev crash doesn't corrupt the dev DB
    # either, and so the failure mode is reproducible locally.
    stop_grace_period: 60s
    shm_size: "256mb"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d singalong"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../../apps/singalong-backend
      dockerfile: ../../infrastructure/development/Backend.dockerfile
    container_name: singalong-dev-backend
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/singalong
      APP_ENV: development
      SINGALONG_BASE_URL: ${SINGALONG_BASE_URL:-http://localhost:9000}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5190
      SINGALONG_ADMIN_USERNAME: ${SINGALONG_ADMIN_USERNAME:-admin}
      SINGALONG_ADMIN_PASSWORD: ${SINGALONG_ADMIN_PASSWORD:-password}
      JWT_SECRET_KEY: ${SINGALONG_JWT_SECRET_KEY:-singalong-dev-jwt-secret-key-longer-than-32-bytes-required}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${SINGALONG_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      ENABLE_LYRICS_WEB_SEARCH: ${ENABLE_LYRICS_WEB_SEARCH:-true}
      ENABLE_METADATA_WEB_SEARCH: ${ENABLE_METADATA_WEB_SEARCH:-true}
    ports:
      - "8069:8000"
    volumes:
      - ../../apps/singalong-backend:/app
      - ./data/singalong-backend:/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  client:
    build:
      context: ../../apps/singalong-client
      dockerfile: ../../infrastructure/development/Client.dockerfile
    container_name: singalong-dev-client
    environment:
      VITE_API_BASE_URL: http://localhost:8069
      VITE_BASE_PATH: /
    ports:
      - "5190:5173"
    volumes:
      - ../../apps/singalong-client:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
