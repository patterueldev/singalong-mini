name: Build Web Service

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
        description: 'Build environment: dev, qa, or prod'

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    name: Build AMD64 Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=${{ inputs.env }}-amd64
            type=sha,prefix=${{ inputs.env }}-,suffix=-amd64

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/production/Singalong.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/web:${{ inputs.env }}
          cache-to: type=inline

  build-arm64:
    name: Build ARM64 Image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=${{ inputs.env }}-arm64
            type=sha,prefix=${{ inputs.env }}-,suffix=-arm64

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/production/Singalong.dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/web:${{ inputs.env }}
          cache-to: type=inline

  create-manifest:
    name: Create Multi-Platform Manifest
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          # Create manifest for env tag
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}/web:${{ inputs.env }} \
            ghcr.io/${{ github.repository }}/web:${{ inputs.env }}-amd64 \
            ghcr.io/${{ github.repository }}/web:${{ inputs.env }}-arm64
          
          # Create manifest for SHA tag
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}/web:${{ inputs.env }}-${{ github.sha }} \
            ghcr.io/${{ github.repository }}/web:${{ inputs.env }}-${{ github.sha }}-amd64 \
            ghcr.io/${{ github.repository }}/web:${{ inputs.env }}-${{ github.sha }}-arm64

      - name: Image pushed
        run: |
          echo "✓ Multi-platform web image built and pushed to GHCR"
          echo "Image: ghcr.io/${{ github.repository }}/web:${{ inputs.env }}"
          echo "Platforms: linux/amd64, linux/arm64"