name: Build Web Service

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
        description: 'Build environment: dev, qa, or prod'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Web Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=${{ inputs.env }}
            type=sha,prefix=${{ inputs.env }}-

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/production/Singalong.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/web:${{ inputs.env }}
          cache-to: type=inline

      - name: Image pushed
        run: |
          echo "✓ Web image built and pushed to GHCR"
          echo "Image: ghcr.io/${{ github.repository }}/web:${{ inputs.env }}"
