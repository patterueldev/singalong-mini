name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
      - main

jobs:
  # Detect changed files for conditional jobs
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      client: ${{ steps.changes.outputs.client }}
      player: ${{ steps.changes.outputs.player }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          # Get the merge base for comparing branches
          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          
          # Check if Backend files changed
          if git diff --name-only $MERGE_BASE HEAD | grep -q "^apps/singalong-backend/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if Client files changed
          if git diff --name-only $MERGE_BASE HEAD | grep -q "^apps/singalong-client/"; then
            echo "client=true" >> $GITHUB_OUTPUT
          else
            echo "client=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if Player files changed
          if git diff --name-only $MERGE_BASE HEAD | grep -q "^apps/singalong-player/"; then
            echo "player=true" >> $GITHUB_OUTPUT
          else
            echo "player=false" >> $GITHUB_OUTPUT
          fi

  # Base checks: enforce RC branch rules
  base-checks:
    name: Base checks (RC branch rules)
    uses: ./.github/workflows/pr-base-checks.yml

  # Conventional commits: validate PR title and body
  conventional-commits:
    name: Conventional commits and PR body
    uses: ./.github/workflows/pr-conventional-commits.yml

  # Backend build: only run if backend files changed
  backend-checks:
    name: Backend checks
    needs: detect-changes
    uses: ./.github/workflows/pr-apps-backend-checks.yml
    if: needs.detect-changes.outputs.backend == 'true'

  # Client frontend build: only run if client files changed
  client-checks:
    name: Client checks
    needs: detect-changes
    uses: ./.github/workflows/pr-apps-client-checks.yml
    if: needs.detect-changes.outputs.client == 'true'

  # Player frontend build: only run if player files changed
  player-frontend-checks:
    name: Player frontend checks
    needs: detect-changes
    uses: ./.github/workflows/pr-apps-player-checks.yml
    if: needs.detect-changes.outputs.player == 'true'

  # Summary: display overall check results
  summary:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, base-checks, conventional-commits, backend-checks, client-checks, player-frontend-checks]
    if: always()
    steps:
      - name: Check for failures
        run: |
          # Fail summary if any required check failed
          FAILED=false
          
          # base-checks and conventional-commits always run
          if [ "${{ needs.base-checks.result }}" = "failure" ]; then
            echo "❌ Base checks failed"
            FAILED=true
          fi
          
          if [ "${{ needs.conventional-commits.result }}" = "failure" ]; then
            echo "❌ Conventional commits validation failed"
            FAILED=true
          fi
          
          # backend-checks: only fails if it ran and failed (not if skipped)
          if [ "${{ needs.backend-checks.result }}" = "failure" ]; then
            echo "❌ Backend checks failed"
            FAILED=true
          fi
          
          # client-checks: only fails if it ran and failed (not if skipped)
          if [ "${{ needs.client-checks.result }}" = "failure" ]; then
            echo "❌ Client checks failed"
            FAILED=true
          fi
          
          # player-frontend-checks: only fails if it ran and failed (not if skipped)
          if [ "${{ needs.player-frontend-checks.result }}" = "failure" ]; then
            echo "❌ Player frontend checks failed"
            FAILED=true
          fi
          
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

      - name: Generate Summary
        run: |
          echo "## ✅ PR Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Changed" >> $GITHUB_STEP_SUMMARY
          echo "- Master: ${{ needs.detect-changes.outputs.master }}" >> $GITHUB_STEP_SUMMARY
          echo "- Client: ${{ needs.detect-changes.outputs.client }}" >> $GITHUB_STEP_SUMMARY
          echo "- Player: ${{ needs.detect-changes.outputs.player }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Executed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Base Checks (RC branch rules)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Conventional Commits (PR format)" >> $GITHUB_STEP_SUMMARY
          
          # Conditionally show master checks
          if [ "${{ needs.detect-changes.outputs.master }}" = "true" ]; then
            MASTER_STATUS="${{ needs.master-backend-checks.result }}"
            MASTER_ICON=$([ "$MASTER_STATUS" = "success" ] && echo "✅" || echo "❌")
            echo "- $MASTER_ICON Master Backend Checks ($MASTER_STATUS)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⊘ Master Backend Checks (skipped - no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Conditionally show node checks
          if [ "${{ needs.detect-changes.outputs.node }}" = "true" ]; then
            NODE_STATUS="${{ needs.node-backend-checks.result }}"
            NODE_ICON=$([ "$NODE_STATUS" = "success" ] && echo "✅" || echo "❌")
            echo "- $NODE_ICON Node Backend Checks ($NODE_STATUS)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⊘ Node Backend Checks (skipped - no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Conditionally show admin checks
          if [ "${{ needs.detect-changes.outputs.admin }}" = "true" ]; then
            ADMIN_STATUS="${{ needs.admin-frontend-checks.result }}"
            ADMIN_ICON=$([ "$ADMIN_STATUS" = "success" ] && echo "✅" || echo "❌")
            echo "- $ADMIN_ICON Admin Frontend Checks ($ADMIN_STATUS)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⊘ Admin Frontend Checks (skipped - no changes)" >> $GITHUB_STEP_SUMMARY
          fi